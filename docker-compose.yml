services:
  app:
    build:
      context: .
      args:
        PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${PUBLIC_KEYSTATIC_GITHUB_APP_SLUG:-}
    image: personal-site:local
    container_name: personal-site
    ports:
      - "4321:4321"
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      # Phase 4 (GitHub mode) will add here, runtime-only, never baked into the image:
      #   KEYSTATIC_GITHUB_CLIENT_ID
      #   KEYSTATIC_GITHUB_CLIENT_SECRET
      #   KEYSTATIC_SECRET
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4321/en/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
